<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WHEELY</title>
  <style>
    :root {
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      width: 300px;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-header,
    .slider-row {
      display: flex;
      align-items: center;
    }

    .settings-header {
      justify-content: space-between;
      gap: 12px;
    }

    .settings-label {
      color: #3c4043;
      font-size: 13px;
    }

    #sensitivity_value {
      color: #202124;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    #reset_sensitivity {
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 4px 9px;
      background: #ffffff;
      color: #5f6368;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      transition:
        background-color 120ms ease,
        border-color 120ms ease,
        color 120ms ease;
    }

    #reset_sensitivity:hover {
      border-color: #bdc1c6;
      background: #f8f9fa;
      color: #202124;
    }

    #reset_sensitivity:focus-visible,
    .support-link:focus-visible {
      outline: 2px solid #9aa0a6;
      outline-offset: 2px;
    }

    .slider-row {
      gap: 8px;
    }

    .slider-label {
      color: #80868b;
      font-size: 11px;
    }

    #sensitivity {
      min-width: 0;
      flex: 1;
      margin: 0;
      accent-color: #5f6368;
    }

    .support-footer {
      border-top: 1px solid #e5e7eb;
      margin-top: 18px;
      padding-top: 12px;
      text-align: center;
    }

    .support-link {
      color: #80868b;
      font-size: 12px;
      text-decoration: none;
      transition: color 120ms ease;
    }

    .support-link:hover,
    .support-link:focus-visible {
      color: #3c4043;
    }
  </style>
</head>
<body>
  <h1>WHEELY</h1>

  <div class="settings">
    <div class="settings-header">
      <div class="settings-label">
        Scroll sensitivity: <span id="sensitivity_value"></span>
      </div>
      <button id="reset_sensitivity" type="button">Reset</button>
    </div>
    <div class="slider-row">
      <span class="slider-label">Slow</span>
      <input id="sensitivity" type="range" min="0.1" max="3" step="0.01">
      <span class="slider-label">Fast</span>
    </div>
  </div>

  <footer class="support-footer">
    <a
      class="support-link"
      href="https://www.paypal.com/donate/?hosted_button_id=5B7DW8WU25SS8"
      target="_blank"
      rel="noopener noreferrer"
    >Support WHEELY ❤️</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
